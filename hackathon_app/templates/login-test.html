{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Secure Login Mock</title>
  <link rel="stylesheet" href="{% static 'styles.css' %}">
    <style>
        body{
            background-image: url("{% static 'new login image.png' %}");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
        }
        .button{
            width: 70%;
            padding: 10px;
            background-color: #007bff;
            color: aliceblue;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
            margin-left: 15%;
        }
        .button:hover {
            background-color: midnightblue;
        }
    </style>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://hackathon-2026-4uvk.onrender.com/;">
</head>
<body>
  <div class="container">
    <h2>Login</h2>
    <form action = "" method = "post">
    {% csrf_token %}
    {{ form }}
    <label>
        <input type="submit" class = "button" value = "log in">
    </label>
    </form>
    <div class="links">
      <a href="#" id="forgotPassword">Forgot password?</a>
      <a href="#" id="recoverAccount">Recover account</a>
    </div>

    <div id="message" class="message"></div>
    <div class="note">
      Security note: Max 3 failed login attempts per hour (demo only).
    </div>
  </div>
</body>
</html>
